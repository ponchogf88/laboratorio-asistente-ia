name: Automation Engine CI

on:
  pull_request:
    paths:
      - "automation_engine/**"
      - ".github/workflows/automation-engine-ci.yml"
  push:
    branches: [main]
    paths:
      - "automation_engine/**"
      - ".github/workflows/automation-engine-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation_engine/requirements-dev.txt
      - run: pip install -r automation_engine/requirements-dev.txt
      - run: python -m pytest -q
