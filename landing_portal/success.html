<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pago recibido | Laboratorio IA</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-white grid place-items-center p-6"><main class="max-w-xl w-full rounded-3xl border border-emerald-700/50 bg-slate-900 p-10 text-center shadow-2xl"><div class="text-5xl">✓</div><p class="mt-5 text-sm font-semibold uppercase tracking-widest text-emerald-400">Pago recibido</p><h1 class="mt-3 text-3xl font-black">Bienvenido al Laboratorio IA</h1><p class="mt-4 text-slate-300">Tu pago se valida por Stripe. Entra al aula para comenzar con las sesiones y plantillas del piloto.</p><a id="classroomButton" class="mt-8 inline-block rounded-xl bg-indigo-600 px-7 py-4 font-bold hover:bg-indigo-500" href="#">Entrar al Laboratorio</a><p id="notice" class="mt-5 text-xs text-slate-500">Si el botón no aparece, contacta al equipo con tu comprobante de Stripe.</p></main><script src="./checkout-config.js"></script><script>const url=String(window.LAB_CLASSROOM_URL||"").trim();const button=document.getElementById("classroomButton");if(!url.startsWith("https://classroom.google.com/")){button.remove();document.getElementById("notice").textContent="Acceso en configuración: no se otorgó ningún acceso todavía."}else{button.href=url;}</script></body></html>
